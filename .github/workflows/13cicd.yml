name: Experiment-13 CI/CD

on:
  push:
    paths:
      - 'backend/Experiment-13/**' # Only run if this folder changes
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend/Experiment-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Tests via Docker Compose
        run: |
          # --exit-code-from backend ensures the job fails if pytest fails
          docker compose up --build --exit-code-from backend

      - name: Login to Docker Hub
        if: success() && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Production Image
        if: success() && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: backend/Experiment-13
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/flask-student-api:latest