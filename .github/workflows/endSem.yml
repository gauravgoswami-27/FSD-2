name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    # Only trigger if changes are made inside the project folder
    paths:
      - 'EndSem-WS3/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'EndSem-WS3/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Setting the default directory for all 'run' commands
    defaults:
      run:
        working-directory: ./EndSem-WS3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- BACKEND CI ---
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip' # Automatically caches your requirements
          cache-dependency-path: 'EndSem-WS3/backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          cd backend
          # Runs your test_app.py file
          python test_app.py

      # --- FRONTEND CI ---
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'EndSem-WS3/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci # Better than 'npm install' for CI environments
          npm run build

      # --- DOCKER BUILD ---
      - name: Build with Docker Compose
        run: |
          docker compose build
        # This uses the docker-compose.yml located in ./EndSem-WS3

      # --- OPTIONAL: LOG IN AND PUSH TO DOCKER HUB ---
      # Un-comment the section below if you want to push your images
      #
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Push Backend Image
      #   run: docker compose push backend
      #
      # - name: Push Frontend Image
      #   run: docker compose push frontend